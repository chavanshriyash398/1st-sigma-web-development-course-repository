<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 130px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
            background-color: aqua;
            position: absolute;
            top: 0px;
            /*absolute = the element will find nearest parent which have there positon not static and static is default for all. it will find from .parent>body>html*/

        }

        .box2 {

            background-color: brown;
            position: relative;
            /*relative is for to change poition*/
            top: -12px;
            left: 80px;
            z-index: 0;
            ;
            /*z-index= for changing depth or overlay type*/
        }

        .box3 {
            position: fixed;/*fixed= this is for to fix position even if you scroll like ads*/
            bottom: 0%;
            right: 0%;
            background-color: cadetblue;
        }

        .box4 {
            position: sticky;
            top: 0px;
            margin: 0;
            padding: 0;
            height: 117px;
            width: 711px;


            background-color: crimson;
        }

        .parent {
            height: 1470px;
            position: absolute;
            border: 2px solid blue;
            padding: 33px;
            margin: 20px;
            /*transform, filter, or perspective properties can also make an element appear as positioned */
            /*ex.= transform:translate(0); absolute tag will follow this*/
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1">Absolute</div>
        <div class="box box2">Relative</div>
        <div class="box box3">Fixed</div>
        <div class="box box4">Sticky</div>
    </div>
</body>

</html>
