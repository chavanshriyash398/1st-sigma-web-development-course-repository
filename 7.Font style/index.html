<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts style </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap');

        p {
            /* fonts where applies which is applicable 1st which is available in device in decreasing order like if Segoe UI is not available then Tahoma will apply and so*/
            /* font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; */
            /* font-style: italic; */
            font-family: 'baloo-bhai-2', 'sans-serif';
            /* font-weight: 500; */
            /* text-decoration: underline; */
        }

        h2 {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-style: oblique;
            text-decoration: underline;
            font-weight: 200;
            text-decoration-thickness: 7px;
            text-decoration-color: aqua;
            /* text-indent: 14px; */
            text-overflow: ellipsis;
        }

        .lorem{
            border: 2px solid red;
            width: 20px;
            text-decoration-color: aqua;
            word-break: break-all;
            text-overflow: ellipsis;
            overflow: hidden;
        }

    </style>
</head>

<body>
    <h2>This is html about fonts</h2>
    <p>
        this is about fonts
    </p>
    <p class="lorem">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit perferendis eveniet commodi animi sequi
        repudiandae recusandae deleniti repellat. Magni eveniet consectetur aliquid porro. Reprehenderit libero totam
        deleniti?</p>

</body>

</html>
