<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows</title>
    <style>
    p { 
        border-style: groove;
        border-color: black;
        box-shadow: 10px 7px 10px 0px red;
    }
    div {
        text-shadow: 6px 5px 10px #0a0089;
        /* outline is this place in out of border and doesnt takes space but cant change its width and radius */
        outline: 2px solid black;
        outline-offset: 15px; /*for changing size*/
        border-style: solid;
        border: red;
        border: 10px;
    } 




    </style>
</head>
<body>
    <p>This is Shadow</p>
    <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque doloribus assumenda reprehenderit? Aliquid ex deleniti laboriosam doloremque totam ipsum corrupti eligendi tempora, adipisci in libero, fugit alias. Magnam dolores, laborum reprehenderit aperiam necessitatibus pariatur?</div>
</body>
</html>
