<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box</title>
    <style>

        .box{
            background-color: aqua;
        }
        .box1{
            color: brown;
            padding: 20px;
            margin:10px;
            border:5px;
            height: 30px;
            box-sizing: border-box;
            border-style:dotted;
            /* <!--box-sizing: border box = height includes padding and bprder--> */
        }
        .box2{
            color: darkgreen;
        }
    </style>
</head>
<body>
    <p  class="box box1"> I am box 1 </p>
       
    <p class="box box2">  I am box 2</p>
    
</body>
</html>
