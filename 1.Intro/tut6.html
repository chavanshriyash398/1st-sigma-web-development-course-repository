<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links and images</title>
  
</head>
<body>
   <!-- a for link , target for command, _blank for link open in new page -->
    <a href="https://google.com" target="_blank">go to google</a><br>
    <a href="https://facebook.com" target="_blank">go to facebook</a><br>
    <a href="https://twitter.com" target="_blank">go to twitter</a><br>
    <a href="https://amazone.com" target="_blank">go to amazone</a><br>

    <!--  <a href="/ for attaching internal file  -->
    <a href="/tut5.html"target=_blank> tut 5"</a>  
    <!-- img for image link and image is not found hence alt text will shown -->
    <img src="shri.jpg" alt="error loading image">
    <img src="https://source.unsplash.com/600*900/?nature,water" alt="not found">     

</body>
</html>
