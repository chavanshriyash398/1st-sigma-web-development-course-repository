<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h2>This is html form tutorial</h2>
    <!--[action=means file where to submit,ex.=backend.php], name=means value of form, div for division-->
    <form action="backend.php">
        <div>
            Name: <input type="text" name="MyName"> 
        </div>
        <br>
        <div>
            Role: <input type="text" name="MyRole">
        </div>
        <br>
        <div>
            Email: <input type="email" name="MyEmail">
        </div> 
       
        <br>
        <div>
            My date= <input type="date" value="Mydate">
        </div>
        <br>
        <div>
            My eligibility= <input type="checkbox" value="MyEligibility">
        </div>
        <br>
        <div>
            My Gender= Male<input type="radio" value="MyGenderd"> 
             female<input type="radio" value="MyGenderd"> Other<input type="radio" value="MyGenderd"> 
        </div>
        <br> 
        <div>
            <input type="submit" value="submit now">
        </div>
        <div>
            <label for="comment">enter your comment</label>
            <textarea name="comment" id="comment" rows="7"columnspan="201"></textarea>
        </div>
 


        


    </form>
</body>
</html>
