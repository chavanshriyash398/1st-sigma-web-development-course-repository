<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display properties</title>
    <style>
        .box {
            border: 2px;
            border-style: dotted;
            border-color: black;
        }

        .line {
            border: 2px;
            border-style: dotted;
            border-color: black;
            display: inline;
            /* inline property for blocked element arrange to inline element*/
        }

        .visible {
            border: 2px;
            border-style: dotted;
            border-color: black;
            /* display: none; this is property in which it hides vibility as well as its space */
            visibility: hidden; /*this is property is the he hides visibilty but space is present there*/

            padding: 45px;
            margin: 45px;
        }

        .inline {
            border: 2px;
            border-style: dotted;
            border-color: black;
            display: inline-block;
            /* inlineblock property for blocked element arrange to inline element and there margin and padding will apply to all side*/
            padding: 45px;
            margin: 45px;
        }
    </style>
</head>

<body>
    <div class="box"> div is blocked element</div>
    <span>I am a good</span>
    <span>boy</span>
    <hr>


    <div class="line"> div is blocked element</div>
    <span>I am a good</span>
    <span>boy</span>
    <hr>


    <div class="visible"> div is blocked element</div>
    <span>I am a good</span>
    <span>boy</span>



    <div class="inline"> div is blocked element</div>
    <span>I am a good</span>
    <span>boy</span>







</body>

</html>
