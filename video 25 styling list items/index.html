<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling list items</title>
    <style>
        ul li {
            /* list-style: devanagari; */
            /* list-style: none;  = to hide listing number */
            list-style-type:"👵🏻";
            background-color: aqua;
            list-style-position: inside;/*inside is for list number cant be in background and in border*/
            border: 2px solid red;
            /* list-style: disc inside ;   = you can add multiple property like image and all */
            /* list-style-image:url(you can put images as list nu,ber) ; */}
            .one {
                display: flex;
                list-style: none; 
                padding: 22px; 

            }

    </style>
</head>
<body>
    <ul>
        <li>first</li>
        <li>second</li>
        <li>third</li>
    </ul>
    <br> 


    <ul class="one">
        <li>first</li>
        <li>second</li>
        <li>third</li>
    </ul>

    
</body>
</html>
