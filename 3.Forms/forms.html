<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - lets learn it</title>
</head>

<body>
    <h2>Form for sigma web developement course</h2>
    <form action="post">
        <div> <label for="username"> Enter your username</label>
            <!-- autofocus used for when after entered page cursol will auto focused on that side -->
            <input type="text" id="username" name="username" placeholder="enter your name" autofocus>

        </div>
        <div>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="Gender" value="female">
            <label for="Female">Female</label>
            <div>
                <input type="checkbox" name="subscribe" id="subscribe">
                <label for="subscribe">subscribed or not?</label>
            </div>
            <div>
                <label for="comment">enter your comment</label><br>
                <textarea name="comment" id="comment" rows="7" cols="20">enter your comment</textarea>
            </div>
            <div>
                <select name="Fruits" id="Fruits">enter your favrouite fruit
                    <option value="apple">Apple</option>
                    <option value="banana">Banana</option>
                    <option value="cherry">Cherry</option>
                </select>
            </div>
    </form>
    </div>
</body>

</html>
